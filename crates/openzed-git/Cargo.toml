[package]
name = "openzed-git"
version = "1.5.0"
edition = "2021"
description = "Extra Git tools for Zed through a Rust CLI and Zed Tasks integration."
license = "MIT"
repository = "https://github.com/aswin402/openzed-git"
keywords = ["git", "zed", "github", "cli"]
categories = ["utility", "development-tools"]
authors = ["Aswin"]

[[bin]]
name = "openzed-git"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
dialoguer = "0.11"
colored = "2"
open = "5"
toml = "0.8"
chrono = "0.4"
